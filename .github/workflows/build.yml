# Tote — Build & Release Pipeline (Phase 12)
#
# Compiles the Android app, runs unit tests, signs the APK with the release
# keystore, verifies with apksigner, and attaches to GitHub Releases on tag.
#
# Per build-learnings iron rule #17 / headline lesson #16:
#   Use `apksigner verify --print-certs --verbose`, NOT `keytool -printcert -jarfile`.
#
# Per build-learnings iron rule #4: green CI != working app. Tests validate
# the function; they don't validate the wiring.
#
# Per build-learnings iron rule #2: no secrets in this file. All secrets come
# from GitHub Actions secrets (TOTE_KEYSTORE_BASE64, etc.).

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # needed by softprops/action-gh-release to create releases
  id-token: write   # needed by actions/attest-build-provenance for SLSA
  actions: read     # needed by mikepenz/action-junit-report to create checks

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Guard: if app/ exists, codeql + osv-scanner must be in workflows/ (not parked)
  assert-no-app-without-scanners:
    name: "Guard: scanners active"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: "Check scanners are active when app/ exists"
        run: |
          set -eu
          if [ -d "app" ]; then
            if [ -f ".github/workflows-pending/codeql.yml" ]; then
              echo "::error::app/ exists but codeql.yml is still parked"
              exit 1
            fi
            if [ -f ".github/workflows-pending/osv-scanner.yml" ]; then
              echo "::error::app/ exists but osv-scanner.yml is still parked"
              exit 1
            fi
            echo "OK: scanners are active"
          else
            echo "No app/ module — scanners correctly parked"
          fi

  build-android:
    name: "Build Android APK"
    runs-on: ubuntu-latest
    needs: assert-no-app-without-scanners
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Set up JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOTE: android-actions/setup-android@v3 is NOT needed — ubuntu-latest runners
      # have the Android SDK pre-installed at /usr/local/lib/android/sdk.
      # The setup-android action fails with "Failed to find package 'tools'" on
      # newer runners because the "tools" package was removed from the SDK.
      - name: "Verify Android SDK is available"
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "No platforms listed"

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v3
        continue-on-error: true
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: "Build debug APK (smoke test)"
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: "Run unit tests"
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: "Publish test results"
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'app/build/test-results/**/*.xml'
          require_tests: false

      # === Release build (only on main push or tags) ===
      - name: "Decode release keystore"
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          echo "${{ secrets.TOTE_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/tote-release.keystore

      - name: "Build release APK"
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          TOTE_KEYSTORE_BASE64: ${{ secrets.TOTE_KEYSTORE_BASE64 }}
          TOTE_KEYSTORE_PASSWORD: ${{ secrets.TOTE_KEYSTORE_PASSWORD }}
          TOTE_KEY_ALIAS: ${{ secrets.TOTE_KEY_ALIAS }}
          TOTE_KEY_PASSWORD: ${{ secrets.TOTE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: "Verify APK signature (apksigner, NOT keytool)"
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          set -eu
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK"
          # Find apksigner in available build-tools
          BT=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          # Run apksigner verify verbose (prints certs + signing schemes)
          "$APKSIGNER" verify --print-certs --verbose "$APK"

          # Extract cert SHA-256. Modern apksigner output is:
          #   "V2 Signer: certificate SHA-256 digest: <hex>"
          # We grep for that specific line (not "public key SHA-256").
          CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 \
            | grep -E 'certificate SHA-256 digest' \
            | head -1 \
            | sed -E 's/.*certificate SHA-256 digest: //' \
            | tr -d '[:space:]')
          echo "Cert SHA-256: $CERT_SHA256"
          EXPECTED="df96cae5c963cef4b2adccd6ccf3a76113a0386e2376232f3dc758374acf4196"
          if [ "${CERT_SHA256,,}" != "$EXPECTED" ]; then
            echo "::error::Cert SHA-256 mismatch! Got '$CERT_SHA256', expected $EXPECTED"
            exit 1
          fi
          echo "Cert verification: OK"

      - name: "Generate .sha256 sidecar"
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          sha256sum "$APK" > "$APK.sha256"
          echo "SHA-256: $(cat "$APK.sha256")"

      - name: "Attest build provenance (SLSA)"
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'app/build/outputs/apk/release/*.apk'

      - name: "Upload APK artifact"
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tote-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: "Publish to GitHub Releases (on tag)"
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
