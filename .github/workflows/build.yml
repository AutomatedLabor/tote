# Tote - Build & Test
#
# Phase 1 (planning): placeholder. Will be replaced with the real Android
# Gradle build once the app/ module exists.
#
# Per build-learnings headline lesson #16: when releases exist, the build
# MUST produce a v1+v2+v3-signed APK verified by `apksigner verify
# --print-certs --verbose`, NOT `keytool -printcert -jarfile` (which is
# v1-only and false-negatives v2/v3-only APKs).
#
# Per build-learnings headline lesson #4: green CI != working app. The build
# also needs a wiring test with production defaults.
#
# Per build-learnings iron rule #2: no secrets in the workflow file. Signing
# keys are passed via ${{ secrets.* }} references.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  placeholder:
    name: "Phase 1 placeholder - no app code yet"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Check repo state"
        run: |
          echo "Tote is in PLANNING phase. No app/ module exists yet."
          echo "Once Phase 1 begins, this workflow will:"
          echo "  1. Set up JDK 17 + Android SDK."
          echo "  2. Cache Gradle dependencies (with Aliyun mirror first, per threshold LEARNINGS)."
          echo "  3. Run: ./gradlew :app:assembleRelease"
          echo "  4. Sign the APK with v1+v2+v3 (per build-learnings headline lesson #16)."
          echo "  5. Verify with apksigner verify --print-certs --verbose."
          echo "  6. Upload the APK + .sha256 sidecar to GitHub Releases (on tag)."
          echo ""
          echo "For now, this workflow just confirms the repo is reachable."
          exit 0

