# Tote - CodeQL semantic code analysis
#
# Per build-learnings iron rule #4 (green CI != working app) and headline
# lesson #16 (use the canonical tool): CodeQL catches security vulnerabilities
# that unit tests miss.
#
# Note: CodeQL requires the Gradle wrapper jar to exist (to autobuild).
# The wrapper jar is generated by `gradle wrapper --gradle-version 8.7`.
# Until it exists, CodeQL will fail the autobuild step. This workflow
# skips gracefully if the wrapper jar is missing.

name: codeql

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '17 4 * * 1'  # Weekly Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  check-prerequisites:
    name: "Check: Kotlin source + Gradle wrapper present?"
    runs-on: ubuntu-latest
    outputs:
      can-run: ${{ steps.check.outputs.can-run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: check
        name: "Verify Kotlin source + gradle-wrapper.jar exist"
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ] && \
             [ -n "$(find app -name '*.kt' -o -name '*.java' 2>/dev/null | head -1)" ]; then
            echo "can-run=true" >> "$GITHUB_OUTPUT"
            echo "OK: wrapper jar + Kotlin source present — CodeQL can run."
          else
            echo "can-run=false" >> "$GITHUB_OUTPUT"
            echo "SKIP: missing gradle-wrapper.jar or Kotlin source — CodeQL would fail."
          fi

  analyze:
    name: "CodeQL analyze"
    runs-on: ubuntu-latest
    needs: check-prerequisites
    if: needs.check-prerequisites.outputs.can-run == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Set up JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v3

      - name: "Initialize CodeQL"
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: "Perform CodeQL analysis"
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"

  skip-notice:
    name: "CodeQL skipped (no wrapper jar yet)"
    runs-on: ubuntu-latest
    needs: check-prerequisites
    if: needs.check-prerequisites.outputs.can-run == 'false'
    steps:
      - name: "Report skip"
        run: |
          echo "CodeQL skipped: gradle-wrapper.jar not yet generated."
          echo "To enable: run 'gradle wrapper --gradle-version 8.7' and commit the wrapper files."
          echo "This is expected during the scaffold phase — no real Kotlin to analyze yet."
