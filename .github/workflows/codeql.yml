# Tote - CodeQL semantic code analysis
#
# Per build-learnings iron rule #4 (green CI != working app) and headline
# lesson #16 (use the canonical tool): CodeQL catches security vulnerabilities
# that unit tests miss.

name: codeql

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '17 4 * * 1'  # Weekly Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: "CodeQL analyze"
    runs-on: ubuntu-latest
    # Skip if there's no Kotlin source yet (no app/ module). CodeQL fails
    # with "did not detect any code written in languages supported" if
    # there's no Java/Kotlin source to analyze.
    if: hashFiles('app/**/*.kt', 'app/**/*.java') != ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Initialize CodeQL"
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          # If you have a custom config, point to it here.
          # config-file: ./.github/codeql/codeql-config.yml

      - name: "Perform CodeQL analysis"
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
