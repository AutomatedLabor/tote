title = "Tote gitleaks config"

[extend]
useDefault = true

# Block the literal GitHub PAT pattern and any GitHub PAT from being committed.
[[rules]]
id = "github-pat-tote-blocklist"
description = "Block any GitHub PAT from being committed"
regex = '''ghp_[A-Za-z0-9]{36}'''
tags = ["key", "github", "pat"]

# Block Vercel tokens (vcp_ prefix).
[[rules]]
id = "vercel-token-tote-blocklist"
description = "Block any Vercel token from being committed"
regex = '''vcp_[A-Za-z0-9_]+'''
tags = ["key", "vercel", "token"]

# Allow this gitleaks config itself to mention the regex patterns as strings.
# Note: gitleaks v8.18+ uses [allowlist] (single map), not [[allowlist]] (array of tables).
[allowlist]
description = "Allow the gitleaks config and docs to mention regex patterns as strings"
paths = [
  '''\.gitleaks\.toml$''',
  '''AGENTS\.md$''',
  '''SECURITY\.md$''',
  '''CHANGELOG\.md$''',
  '''README\.md$''',
]
